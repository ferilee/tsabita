name: Publish container image

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Public website URL used for canonical and Open Graph metadata'
        required: false
        default: 'https://tita-binti.ferilee.gurumuda.eu.org'
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            PUBLIC_SITE_URL=${{ inputs.site_url }}
          tags: ghcr.io/ferilee/tsabita:latest
