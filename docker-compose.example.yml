services:
  app:
    image: ghcr.io/ferilee/tsabita:latest
    container_name: tsabita
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_FILE_NAME: /app/data/tsabita.sqlite
    volumes:
      - sqlite_data:/app/data
    networks:
      - ferileenet
    restart: always

volumes:
  sqlite_data:

networks:
  ferileenet:
    external: true
